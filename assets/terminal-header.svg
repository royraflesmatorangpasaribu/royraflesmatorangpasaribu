<svg width="600" height="220" viewBox="0 0 600 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5EA0D0">
        <animate attributeName="offset" values="-2;-1;0;1" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="25%" stop-color="#FFFFFF">
        <animate attributeName="offset" values="-1.75;-0.75;0.25;1.25" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#5EA0D0">
        <animate attributeName="offset" values="-1.5;-0.5;0.5;1.5" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="75%" stop-color="#0E75B6">
        <animate attributeName="offset" values="-1.25;-0.25;0.75;1.75" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#5EA0D0">
        <animate attributeName="offset" values="-1;0;1;2" dur="3s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2027" />
      <stop offset="50%" stop-color="#203A43" />
      <stop offset="100%" stop-color="#2C5364" />
    </linearGradient>
  </defs>

  <!-- terminal window -->
  <rect x="0" y="0" width="600" height="220" rx="14" fill="url(#bg)" />

  <!-- title bar -->
  <rect x="0" y="0" width="600" height="34" rx="14" fill="#00000055" />
  <rect x="0" y="20" width="600" height="14" fill="#00000055" />
  <circle cx="22" cy="17" r="6" fill="#FF5F56" />
  <circle cx="44" cy="17" r="6" fill="#FFBD2E" />
  <circle cx="66" cy="17" r="6" fill="#27C93F" />
  <text x="300" y="22" text-anchor="middle" font-family="Fira Code, monospace" font-size="12" fill="#8FA9BD">roy@github: ~</text>

  <!-- body -->
  <text x="24" y="70" font-family="Fira Code, monospace" font-size="16" fill="#27C93F">$ <tspan fill="#A9C9DD">whoami</tspan></text>
  <text x="24" y="100" font-family="Fira Code, monospace" font-size="24" font-weight="700" fill="url(#shimmer)">Roy Rafles Matorang Pasaribu</text>

  <text x="24" y="140" font-family="Fira Code, monospace" font-size="16" fill="#27C93F">$ <tspan fill="#A9C9DD">cat role.txt</tspan></text>
  <text x="24" y="168" font-family="Fira Code, monospace" font-size="15" fill="#8FA9BD">Back End | Full Stack | System Engineer</text>

  <text x="24" y="200" font-family="Fira Code, monospace" font-size="16" fill="#27C93F">$
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1s" repeatCount="indefinite" />
  </text>
  <rect x="42" y="188" width="9" height="16" fill="#E5E5E5">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1s" repeatCount="indefinite" />
  </rect>
</svg>
